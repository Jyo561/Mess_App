[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
yew = { version = "0.21", features = ["csr"] }
common = { path = "../common" }
gloo-net = "0.5" # For fetching from API
serde = { version = "1.0", features = ["derive"] }
wasm-bindgen = "0.2"
chrono = { version = "0.4", features = ["serde"] }
web-sys = { version = "0.3", features = ["HtmlInputElement"] }
wasm-bindgen-futures = "0.4"
gloo-dialogs = "0.1"

