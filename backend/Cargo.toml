[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common" , features = ["backend"] }
poem = { version = "3.1.12", features = ["anyhow"] }
poem-openapi = { version = "5.1.16", features = ["swagger-ui","chrono"] }
poem-openapi-derive = "5.1.16"
libsql = "0.4" # Turso driver
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
argon2 = "0.6.0"
jsonwebtoken = "11.0.0"
tracing = "0.1.44"
